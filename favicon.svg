<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#123a21"/>
      <stop offset="100%" stop-color="#030b08"/>
    </radialGradient>
    <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#fondo)"/>

  <g fill="none" stroke="#3dff84" filter="url(#brillo)">
    <circle cx="32" cy="32" r="26" stroke-width="3"/>
    <circle cx="32" cy="32" r="15" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="3" fill="#3dff84"/>
  </g>

  <g stroke="#3dff84" stroke-width="4" stroke-linecap="square" filter="url(#brillo)">
    <path d="M32 1 L32 9"/>
    <path d="M32 55 L32 63"/>
    <path d="M1 32 L9 32"/>
    <path d="M55 32 L63 32"/>
  </g>
